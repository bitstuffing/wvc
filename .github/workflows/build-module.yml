name: Build Chromecast Android library

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Chromecast unit tests
        run: ./gradlew :chromecast:testDebugUnitTest --no-daemon

      - name: Build release AAR
        run: ./gradlew :chromecast:assembleRelease --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: chromecast-release
          path: chromecast/build/outputs/aar/*-release.aar
          if-no-files-found: error
          retention-days: 14
